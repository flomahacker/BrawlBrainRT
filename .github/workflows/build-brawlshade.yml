name: Build BrawlShade APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: brawlshade-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-brawlshade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build BrawlShade debug APK
        run: gradle :shade:assembleDebug --no-daemon --stacktrace

      - name: Upload BrawlShade APK
        uses: actions/upload-artifact@v4
        with:
          name: BrawlShade-debug-apk
          path: shade/build/outputs/apk/debug/shade-debug.apk
          if-no-files-found: error
