name: Build BrawlBrainRT APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Download community YOLO models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          curl -fL --retry 3 --retry-delay 2             "https://raw.githubusercontent.com/AngelFireLA/BrawlStarsBotMaking/main/models/entity%20detection/.onnx/PylaEntityDetectorV2.onnx"             -o app/src/main/assets/models/PylaEntityDetectorV2.onnx
          curl -fL --retry 3 --retry-delay 2             "https://raw.githubusercontent.com/AngelFireLA/BrawlStarsBotMaking/main/models/wall%20detection/.onnx/PylaWallDetectorV2.onnx"             -o app/src/main/assets/models/PylaWallDetectorV2.onnx
          ls -lh app/src/main/assets/models

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrawlBrainRT-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: BrawlBrainRT-diagnostics
          path: |
            app/build/outputs/logs/**
            app/build/outputs/mapping/**
          if-no-files-found: ignore
